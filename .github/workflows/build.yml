name: Build SlowReverse.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item (Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg_tmp | Select-Object -First 1).FullName ffmpeg.exe

      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --noconsole --name SlowReverse --add-binary "ffmpeg.exe;." slow_reverse_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: SlowReverse
          path: dist/SlowReverse.exe
